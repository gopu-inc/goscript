name: Goscript CI/CD

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
    paths:
      - '**.gjs'
      - '**.gos'
      - 'src/**'
      - 'lib/**'
      - 'tests/**'
      - 'packages/base/**'
      - 'packages/stdlib/Makefile'
      - 'gpm/**'
      - 'goscript.toml'
      - 'Makefile'
      - '.gitignore'
      - 'golem'
      - 'golem-launcher.sh'
      - 'golem-cli.gjs'
      - 'install.sh'
      - 'update.sh'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.gjs'
      - '**.gos'
      - 'src/**'
      - 'lib/**'
      - 'tests/**'
      - 'packages/base/**'
      - 'packages/stdlib/Makefile'
      - 'gpm/**'
      - 'Makefile'
      - '.gitignore'
      - 'golem'
      - 'golem-launcher.sh'
      - 'golem-cli.gjs'
      - 'install.sh'
      - 'update.sh'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/**'

env:
  GOSCRIPT_VERSION: "1.0.0"

jobs:
  # ============================================
  # JOB 1: Build Goscript + Golem sur multiples plateformes
  # ============================================
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            artifact_name: goscript-release-linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact_name: goscript-release-linux-arm64
          - os: macos-13
            platform: macos
            arch: x86_64
            artifact_name: goscript-release-macos-x86_64
          - os: macos-14
            platform: macos
            arch: arm64
            artifact_name: goscript-release-macos-arm64
          - os: windows-latest
            platform: windows
            arch: x86_64
            artifact_name: goscript-release-windows-x86_64

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🪟 Set up Cygwin for Windows build
        if: matrix.platform == 'windows'
        uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: C:\cygwin
          packages: gcc-core make flex bison libffi-devel zlib-devel coreutils curl tar zip

      - name: 🔧 Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            libffi-dev \
            zlib1g-dev \
            libsqlite3-0 \
            make \
            gcc

      - name: 🔧 Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install flex bison libffi make

      - name: 🔨 Build Goscript on Unix
        if: matrix.platform != 'windows'
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: 🔨 Build Goscript on Windows
        if: matrix.platform == 'windows'
        shell: C:\cygwin\bin\bash.exe --login -o igncr -eo pipefail '{0}'
        run: |
          cd "$GITHUB_WORKSPACE"
          make -j2

      - name: ✅ Test Goscript
        if: matrix.platform != 'windows'
        run: |
          ./build/bin/gd --version

      - name: ✅ Smoke test installed Goscript and Golem
        if: matrix.platform != 'windows'
        run: |
          STAGE="$RUNNER_TEMP/goscript-smoke"
          make install PREFIX="$STAGE"
          "$STAGE/bin/gd" --version
          "$STAGE/bin/golem" help

      - name: ✅ Test Goscript on Windows
        if: matrix.platform == 'windows'
        shell: C:\cygwin\bin\bash.exe --login -o igncr -eo pipefail '{0}'
        run: |
          cd "$GITHUB_WORKSPACE"
          ./build/bin/gd.exe --version

      - name: ✅ Smoke test installed Goscript and Golem on Windows
        if: matrix.platform == 'windows'
        shell: C:\cygwin\bin\bash.exe --login -o igncr -eo pipefail '{0}'
        run: |
          cd "$GITHUB_WORKSPACE"
          STAGE="$(cygpath -u "$RUNNER_TEMP")/goscript-smoke"
          make install PREFIX="$STAGE"
          "$STAGE/bin/gd.exe" --version
          mv "$STAGE/bin/golem" "$STAGE/bin/golem.sh"
          "$STAGE/bin/golem.sh" help

      - name: 📦 Upload Linux test binary
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: goscript-linux
          path: build/bin/gd
          if-no-files-found: error

      - name: 📦 Prepare Windows release archive
        if: matrix.platform == 'windows'
        shell: C:\cygwin\bin\bash.exe --login -o igncr -eo pipefail '{0}'
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          STAGE="$(cygpath -u "$RUNNER_TEMP")/goscript-stage"
          mkdir -p "$STAGE"
          make install PREFIX="$STAGE"
          test -x "$STAGE/bin/gd.exe"
          mv "$STAGE/bin/golem" "$STAGE/bin/golem.sh"
          install -m 755 golem.cmd "$STAGE/bin/golem.cmd"
          for executable in "$STAGE/bin/gd.exe" /usr/bin/curl.exe /usr/bin/tar.exe /usr/bin/sha256sum.exe; do
            if [ -f "$executable" ]; then
              if [ "$executable" != "$STAGE/bin/gd.exe" ]; then
                cp -L "$executable" "$STAGE/bin/"
              fi
              cygcheck "$executable" | while IFS= read -r dependency; do
                case "$dependency" in
                  [A-Za-z]:*.dll|[A-Za-z]:*.DLL)
                    dependency_path=$(cygpath -u "$dependency")
                    if [ -f "$dependency_path" ]; then cp -L "$dependency_path" "$STAGE/bin/"; fi
                    ;;
                esac
              done
            fi
          done
          mkdir -p dist
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/dist/goscript-windows-x86_64.zip" .)
          sha256sum dist/goscript-windows-x86_64.zip > dist/goscript-windows-x86_64.zip.sha256

      - name: 📦 Prepare standalone release archive
        if: matrix.platform != 'windows'
        run: |
          set -eu
          STAGE="$RUNNER_TEMP/goscript-stage"
          make install PREFIX="$STAGE"
          ASSET="goscript-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          tar -czf "dist/$ASSET" -C "$STAGE" bin share
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/$ASSET" > "dist/$ASSET.sha256"
          else
            shasum -a 256 "dist/$ASSET" > "dist/$ASSET.sha256"
          fi

      - name: 📤 Upload standalone release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  # ============================================
  # JOB 2: Tests Goscript
  # ============================================
  test:
    name: Test Goscript
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: goscript-linux
          path: ./build/bin

      - name: 🔧 Setup Goscript
        run: |
          chmod +x ./build/bin/gd
          ./build/bin/gd --version

      - name: 🧪 Run unit tests
        run: |
          GOSCRIPT_BIN=build/bin/gd SKIP_BUILD=1 bash tests/run_tests.sh

      - name: 📊 Generate test report
        run: |
          echo "# Goscript Test Report" > test-report.md
          echo "## Test Results" >> test-report.md
          echo "- Build: ✅ Success" >> test-report.md
          echo "- Version: $(./build/bin/gd --version)" >> test-report.md
          echo "- Date: $(date)" >> test-report.md

      - name: 📤 Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.md

  # ============================================
  # JOB 3: Analyse de code
  # ============================================
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Lint Goscript files
        run: |
          echo "Linting .gjs files..."
          find . -name "*.gjs" -type f | while read file; do
            echo "Checking: $file"
            # Basic syntax check
            grep -n "fn " "$file" | head -5 || true
          done

      - name: 📏 Count lines of code
        run: |
          echo "## Code Statistics" >> code-stats.md
          echo "\`\`\`" >> code-stats.md
          cloc . --exclude-dir=.git,node_modules --quiet || echo "cloc not installed"
          echo "\`\`\`" >> code-stats.md

      - name: 📤 Upload stats
        uses: actions/upload-artifact@v4
        with:
          name: code-stats
          path: code-stats.md

  # ============================================
  # JOB 5: Release (seulement sur tag)
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: goscript-release-*
          path: release-assets
          merge-multiple: true

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Goscript ${{ github.ref_name }}"
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
