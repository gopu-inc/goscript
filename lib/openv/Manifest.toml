# Manifest.toml
# Généré pour OPENV Framework

[metadata]
name = "openv"
version = "0.1.1"
release = "r0"
arch = "x86_64"
description = "File-backed key-value configuration for Goscript"
author = "Mauricio-100 <ceoseshell@gmail.com>"
license = "MIT"
homepage = "https://github.com/gopu-inc/openv"
main = "__self__.gjs"
files = ["__self__.gjs", "get.gjs", "post.gjs", "set.gjs", "README.md"]

[dependencies]
fs = "0.2.0"


[scripts]
build = "mkdir -p build && tar -czf build/openv-0.1.0-r0.x86_64.tar.bool *.gjs .openv Manifest.toml"
test = "gd test.gjs"
